
name: Automatic APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Repository Files
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Unzip
        run: sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o SettingsHub-Android-Without-GitHub.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: SettingsHub-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
